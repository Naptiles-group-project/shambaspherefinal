<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Failed</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #c62828, #ef5350);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Card */
.failed-card {
    background: white;
    padding: 40px 30px;
    border-radius: 15px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    animation: fadeIn 0.5s ease-in-out;
}

/* Icon */
.cross {
    font-size: 60px;
    color: #e53935;
    margin-bottom: 15px;
}

/* Title */
.failed-card h2 {
    margin: 10px 0;
    color: #c62828;
}

/* Text */
.failed-card p {
    color: #555;
    margin-bottom: 25px;
}

/* Buttons */
.btn {
    display: inline-block;
    padding: 12px 20px;
    margin: 5px;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 600;
    transition: 0.3s;
}

.retry {
    background: #1f6b2a;
    color: white;
}

.retry:hover {
    background: #155d22;
}

.home {
    background: #ccc;
    color: #333;
}

.home:hover {
    background: #aaa;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>
<body>

<div class="failed-card">
    <div class="cross">❌</div>

    <h2>Payment Failed</h2>

    <p>Oops! Your payment was not successful.<br>
    Please try again or use a different payment method.</p>

    <a href="{% url 'checkout' %}" class="btn retry">Try Again</a>
    <a href="{% url 'buyer_dashboard' %}" class="btn home">Go Home</a>
</div>

</body>
</html>
