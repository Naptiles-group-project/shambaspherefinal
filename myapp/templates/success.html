<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #f4f6f9;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Card */
.receipt {
    background: white;
    width: 420px;
    border-radius: 12px;
    padding: 25px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    animation: fadeIn 0.5s ease;
}

/* Header */
.receipt-header {
    text-align: center;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 15px;
}

.receipt-header h2 {
    color: #1f6b2a;
    margin: 10px 0;
}

.check {
    font-size: 50px;
    color: #4caf50;
}

/* Info */
.receipt-info {
    margin: 20px 0;
}

.receipt-info p {
    margin: 6px 0;
    font-size: 14px;
    color: #444;
}

/* Total */
.total {
    border-top: 1px dashed #ccc;
    padding-top: 15px;
    margin-top: 15px;
}

.total h3 {
    margin: 5px 0;
    color: #000;
}

/* Button */
.btn {
    display: block;
    text-align: center;
    margin-top: 20px;
    padding: 12px;
    background: #1f6b2a;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    font-weight: bold;
    transition: 0.3s;
}

.btn:hover {
    background: #155d22;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</head>

<body>

<div class="receipt">

    <div class="receipt-header">
        <div class="check">✅</div>
        <h2>Payment Successful</h2>
        <p>ShambaSphere Receipt</p>
    </div>

    <div class="receipt-info">
        <p><strong>Reference:</strong> {{ ref }}</p>
        <p><strong>Email:</strong> {{ request.user.email }}</p>
        <p><strong>Status:</strong> Paid</p>
    </div>

    <div class="total">
        <p><strong>Items Total:</strong> KSh {{ items_total }}</p>
        <p><strong>Delivery Fee:</strong> KSh {{ delivery_fee }}</p>
        <h3>Total Paid: KSh {{ amount }}</h3>
    </div>
    <a href="{% url 'download_receipt' order.id %}">
    <button style="padding:10px; background:green; color:white; border:none;">
        Download Receipt (PDF)
    </button>
</a>

    <a href="{% url 'buyer_dashboard' %}" class="btn">Back to Dashboard</a>

</div>

</body>
</html>
